<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Little List — To‑do</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #252820;
      --muted: #777b70;
      --line: #e8e9e2;
      --paper: #fff;
      --bg: #f5f6f2;
      --green: #567b52;
      --green-dark: #426340;
      --soft-green: #edf3e9;
      --shadow: 0 24px 70px rgba(46, 54, 38, .09), 0 2px 8px rgba(46, 54, 38, .04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 64px 20px;
      display: grid;
      place-items: start center;
      background: radial-gradient(ellipse at 50% 0%, #e9eee3 0, var(--bg) 52%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    .app { width: min(100%, 540px); }
    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(38px, 8vw, 52px); font-weight: 500; letter-spacing: -.045em; }
    .intro { margin: 9px 0 26px; color: var(--muted); font-size: 15px; }
    .card { overflow: hidden; border: 1px solid rgba(221, 224, 214, .8); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    form { display: flex; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
    .task-input {
      flex: 1; min-width: 0; padding: 12px 14px;
      border: 1px solid #e5e7df; border-radius: 10px; outline: none;
      background: #fbfcf9; color: var(--ink); transition: border-color .18s, box-shadow .18s;
    }
    .task-input::placeholder { color: #a2a69c; }
    .task-input:focus { border-color: #91aa88; box-shadow: 0 0 0 3px rgba(86, 123, 82, .12); }
    .add-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 17px; border: 0; border-radius: 10px; background: var(--green); color: white; font-weight: 650; cursor: pointer; transition: background .18s, transform .18s; }
    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(.97); }
    .add-button svg { width: 17px; height: 17px; }
    .toolbar { min-height: 54px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; align-items: center; gap: 4px; }
    .filter { padding: 7px 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; }
    .filter:hover { color: var(--ink); }
    .filter[aria-pressed="true"] { background: var(--soft-green); color: var(--green-dark); }
    .remaining { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .list { list-style: none; margin: 0; padding: 0 18px; }
    .task { display: flex; align-items: center; gap: 13px; min-height: 59px; border-bottom: 1px solid var(--line); animation: arrive .22s ease both; }
    .task:last-child { border-bottom: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .check {
      width: 20px; height: 20px; flex: 0 0 20px; display: grid; place-items: center;
      padding: 0; border: 1.5px solid #d3d7cc; border-radius: 50%; background: white; color: white; cursor: pointer;
      transition: .18s;
    }
    .check:hover { border-color: var(--green); }
    .task.done .check { border-color: var(--green); background: var(--green); }
    .check svg { width: 12px; height: 12px; }
    .task-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; line-height: 1.45; }
    .task.done .task-text { color: #a1a59b; text-decoration: line-through; text-decoration-thickness: 1px; }
    .delete {
      width: 32px; height: 32px; display: grid; place-items: center; flex: 0 0 32px;
      border: 0; border-radius: 8px; background: transparent; color: #a3a79e; cursor: pointer; opacity: 0; transition: .16s;
    }
    .task:hover .delete, .delete:focus-visible { opacity: 1; }
    .delete:hover { background: #fbefed; color: #b45e50; }
    .delete svg { width: 16px; height: 16px; }
    .empty { padding: 43px 20px 46px; text-align: center; }
    .empty-mark { width: 46px; height: 46px; display: grid; place-items: center; margin: 0 auto 14px; border-radius: 15px; background: var(--soft-green); color: var(--green); }
    .empty-mark svg { width: 22px; height: 22px; }
    .empty h2 { margin: 0 0 6px; font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 500; }
    .empty p { margin: 0; color: var(--muted); font-size: 13px; }
    .footer { min-height: 49px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; border-top: 1px solid var(--line); }
    .footer-note { color: #999d93; font-size: 11px; }
    .clear-button { padding: 6px 0 6px 8px; border: 0; background: transparent; color: var(--muted); font-size: 11px; cursor: pointer; }
    .clear-button:hover { color: #a34f43; }
    .clear-button:disabled { visibility: hidden; }
    button:focus-visible { outline: 3px solid rgba(86, 123, 82, .35); outline-offset: 2px; }
    @media (max-width: 420px) { body { padding: 42px 14px; } form { padding: 12px; } .add-button { padding: 0 13px; } .toolbar { padding: 0 11px; } .filter { padding: 7px 8px; } .list { padding: 0 13px; } .delete { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow">A little space to focus</p>
    <h1>My to‑do list</h1>
    <p class="intro">One thing at a time. You’ve got this.</p>

    <section class="card" aria-label="To-do list">
      <form id="task-form">
        <input class="task-input" id="task-input" type="text" maxlength="160" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
        <button class="add-button" type="submit">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add task
        </button>
      </form>
      <div class="toolbar" aria-label="List controls">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <span class="remaining" id="remaining" aria-live="polite"></span>
      </div>
      <ul class="list" id="task-list" aria-label="Tasks"></ul>
      <div class="empty" id="empty-state" hidden>
        <div class="empty-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m7 12 3.2 3.2L17.5 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/></svg></div>
        <h2 id="empty-title">A fresh start</h2>
        <p id="empty-message">Add a task and make today yours.</p>
      </div>
      <div class="footer">
        <span class="footer-note">Your list stays saved on this device</span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'little-list-tasks-v1';
      const form = document.querySelector('#task-form');
      const input = document.querySelector('#task-input');
      const list = document.querySelector('#task-list');
      const remaining = document.querySelector('#remaining');
      const empty = document.querySelector('#empty-state');
      const emptyTitle = document.querySelector('#empty-title');
      const emptyMessage = document.querySelector('#empty-message');
      const clearCompleted = document.querySelector('#clear-completed');
      const filterButtons = [...document.querySelectorAll('.filter')];
      let filter = 'all';
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved.filter(task => task && typeof task.id === 'string' && typeof task.text === 'string').map(task => ({ id: task.id, text: task.text, done: Boolean(task.done) })) : [];
        } catch { return []; }
      }

      function saveTasks() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
        catch { /* The list still works for this page if storage is unavailable. */ }
      }

      function icon(name) {
        if (name === 'check') return '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3.5 8 3 3 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        return '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6m-6 0 .6 9.5h6.8L14 6m-5 3v4m2-4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }

      function render() {
        const visible = tasks.filter(task => filter === 'all' || (filter === 'active' ? !task.done : task.done));
        list.replaceChildren();
        for (const task of visible) {
          const row = document.createElement('li');
          row.className = `task${task.done ? ' done' : ''}`;
          const check = document.createElement('button');
          check.className = 'check'; check.type = 'button'; check.setAttribute('aria-label', task.done ? `Mark ${task.text} active` : `Complete ${task.text}`); check.setAttribute('aria-pressed', String(task.done));
          if (task.done) check.innerHTML = icon('check');
          check.addEventListener('click', () => updateTask(task.id, { done: !task.done }));
          const text = document.createElement('span'); text.className = 'task-text'; text.textContent = task.text;
          const remove = document.createElement('button'); remove.className = 'delete'; remove.type = 'button'; remove.setAttribute('aria-label', `Delete ${task.text}`); remove.innerHTML = icon('delete');
          remove.addEventListener('click', () => { tasks = tasks.filter(item => item.id !== task.id); saveTasks(); render(); });
          row.append(check, text, remove); list.append(row);
        }
        const count = tasks.filter(task => !task.done).length;
        remaining.textContent = `${count} ${count === 1 ? 'task' : 'tasks'} left`;
        clearCompleted.disabled = !tasks.some(task => task.done);
        empty.hidden = visible.length > 0;
        list.hidden = visible.length === 0;
        if (tasks.length === 0) { emptyTitle.textContent = 'A fresh start'; emptyMessage.textContent = 'Add a task and make today yours.'; }
        else if (filter === 'active' && visible.length === 0) { emptyTitle.textContent = 'All caught up'; emptyMessage.textContent = 'You’ve finished everything on your list.'; }
        else if (filter === 'done' && visible.length === 0) { emptyTitle.textContent = 'Nothing completed yet'; emptyMessage.textContent = 'Finished tasks will find a home here.'; }
        else { emptyTitle.textContent = 'Nothing here'; emptyMessage.textContent = 'Try another filter to see your tasks.'; }
        filterButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === filter)));
      }

      function updateTask(id, changes) {
        tasks = tasks.map(task => task.id === id ? { ...task, ...changes } : task);
        saveTasks(); render();
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) { input.focus(); return; }
        tasks.unshift({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, text, done: false });
        filter = 'all'; saveTasks(); render(); form.reset(); input.focus();
      });
      filterButtons.forEach(button => button.addEventListener('click', () => { filter = button.dataset.filter; render(); }));
      clearCompleted.addEventListener('click', () => { tasks = tasks.filter(task => !task.done); saveTasks(); render(); });
      render();
    })();
  </script>
</body>
</html>
